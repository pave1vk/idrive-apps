# Publish the upstream sync once after its tests pass.
name: Fork upstream release

# One-time SSH-triggered release; remove after successful publication.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fork-release.yml']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commits: each runs in the job that holds the
# contents: write token.
jobs:
  publish:
    # main only: the release commit goes on top of it
    if: github.repository == 'pave1vk/idrive-apps' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release upstream sync for MGU Store'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SOURCE_DATE_EPOCH comes from each component's last commit, and
          # each component's last release from its <id>@<version> tag
          fetch-depth: 0
          # publishing talks to the API through GH_TOKEN; the push below
          # passes the token itself
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      - name: Verify merged code before publication
        run: |
          node release/test/release_test.js
          node apps/robertn_waze_cluster/tools/test_control.js
          node apps/robertn_waze_cluster/tools/test_page.js
          node apps/robertn_waze_cluster/tools/test_profiles.js
          node apps/robertn_waze_cluster/tools/test_i18n.js
          make -C native/cluster-render test
          make -C native/waze-on-cluster test
          make -C native/cluster-render test-x86
          make -C native/waze-on-cluster test-x86

      # the next versions, from the labels of the merged pull requests
      - name: Stamp
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ''
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # shellcheck disable=SC2086 # one id per word
          node release/release.js stamp $COMPONENTS
          git log -1 --stat

      # fails when main moved on since the checkout: run the release again
      - name: Push the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main

      # the tools' builds run make target: Docker, preinstalled on the runner
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
          DRY_RUN: ''
        # the stamped components, and any a stopped run left unlisted
        run: node release/release.js publish --stamped $DRY_RUN

      - name: Published catalog
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
        run: node release/release.js list
